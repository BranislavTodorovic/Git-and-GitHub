<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="calculator" aria-labelledby="calculator-title">
        <h1 id="calculator-title">Web Calculator</h1>
        <div id="display" class="display" role="status" aria-live="polite">0</div>

        <div class="buttons" aria-label="Calculator controls">
            <button type="button" class="clear" id="clear">Clear</button>
            <button type="button" class="operator" data-operator="/" aria-label="Divide">/</button>
            <button type="button" class="operator" data-operator="*" aria-label="Multiply">x</button>
            <button type="button" class="operator" data-operator="-" aria-label="Subtract">-</button>

            <button type="button" data-digit="7">7</button>
            <button type="button" data-digit="8">8</button>
            <button type="button" data-digit="9">9</button>
            <button type="button" class="operator" data-operator="+" aria-label="Add">+</button>

            <button type="button" data-digit="4">4</button>
            <button type="button" data-digit="5">5</button>
            <button type="button" data-digit="6">6</button>
            <button type="button" class="equals" id="equals">=</button>

            <button type="button" data-digit="1">1</button>
            <button type="button" data-digit="2">2</button>
            <button type="button" data-digit="3">3</button>
            <button type="button" data-digit="0" class="zero">0</button>
            <button type="button" id="decimal" aria-label="Decimal point">.</button>
        </div>
    </main>
</body>

</html>
